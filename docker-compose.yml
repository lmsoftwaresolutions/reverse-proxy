version: "3.8"

services:
  nginx:
    image: nginx:latest
    container_name: dev-reverse-proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    networks:
      - web

  lms-frontend:
    image: your-lms-frontend-image
    container_name: lms-frontend
    networks:
      - web

  ssa-frontend:
    image: your-ssa-frontend-image
    container_name: ssa-frontend
    networks:
      - web

  travel-frontend:
    image: your-travel-frontend-image
    container_name: travel-frontend
    networks:
      - web

networks:
  web:
    driver: bridge
