version: "3.8"

services:
  nginx:
    image: nginx:latest
    container_name: dev-reverse-proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    networks:
      - web

networks:
  web:
    external: true
