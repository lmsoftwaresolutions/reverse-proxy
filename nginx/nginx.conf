events {}

http {
  resolver 127.0.0.11 valid=10s;

  # HTTP redirect to HTTPS
  server {
    listen 80;
    server_name lmsoftwaresolutions.local www.lmsoftwaresolutions.local;

    location / {
      return 301 https://$host$request_uri;
    }
  }

  server {
    listen 80;
    server_name successscienceacademy.local www.successscienceacademy.local;

    location / {
      return 301 https://$host$request_uri;
    }
  }

  server {
    listen 80;
    server_name nathkrupa.lmsoftwaresolutions.local;

    location / {
      return 301 https://$host$request_uri;
    }
  }

  # HTTPS servers
  server {
    listen 443 ssl;
    server_name lmsoftwaresolutions.local www.lmsoftwaresolutions.local;

    ssl_certificate /etc/nginx/certs/lmsoftwaresolutions.local/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/lmsoftwaresolutions.local/privkey.pem;

    location / {
      proxy_pass http://lms-frontend:80;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }

  server {
    listen 443 ssl;
    server_name successscienceacademy.local www.successscienceacademy.local;

    ssl_certificate /etc/nginx/certs/successscienceacademy.local/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/successscienceacademy.local/privkey.pem;

    location / {
      proxy_pass http://ssa-frontend:80;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }

  server {
    listen 443 ssl;
    server_name nathkrupa.lmsoftwaresolutions.local;

    ssl_certificate /etc/nginx/certs/nathkrupa.lmsoftwaresolutions.local/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/nathkrupa.lmsoftwaresolutions.local/privkey.pem;

    location / {
      proxy_pass http://travel-frontend:80;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
